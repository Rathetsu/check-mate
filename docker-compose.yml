# One stack for production and development (2026-10-10-16). Local dev:
#   docker compose --profile dev up -d postgres mailpit   # then: pnpm dev
# Full stack behind Caddy:
#   docker compose --profile dev up --build
# Add `--profile tablebase` for endgame tables (scripts/fetch-tablebases.sh first).
name: checkmate

services:
  postgres:
    image: postgres:18.6-alpine # major upgrades are explicit tasks (ADR 16)
    environment:
      POSTGRES_USER: checkmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkmate}
      POSTGRES_DB: checkmate
    volumes:
      - pgdata:/var/lib/postgresql # postgres 18 keeps data in /var/lib/postgresql/18/docker
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U checkmate -d checkmate]
      interval: 2s
      retries: 30

  mailpit: # dev and CI only: catches verification and reset emails
    image: axllent/mailpit:v1.31.5
    profiles: [dev]
    ports:
      - 127.0.0.1:8025:8025 # web UI and API
      - 127.0.0.1:1025:1025 # SMTP

  migrate:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    command: [node, packages/core/src/migrate.ts]
    environment:
      DATABASE_URL: postgres://checkmate:${POSTGRES_PASSWORD:-checkmate}@postgres:5432/checkmate
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgres://checkmate:${POSTGRES_PASSWORD:-checkmate}@postgres:5432/checkmate
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    restart: unless-stopped
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgres://checkmate:${POSTGRES_PASSWORD:-checkmate}@postgres:5432/checkmate
      BETTER_AUTH_URL: https://${SITE_ADDRESS:-localhost}
      TABLEBASE_URL: http://tablebase:9000 # unreachable without the profile: the panel hides
    depends_on:
      migrate: { condition: service_completed_successfully }

  tablebase: # endgame tablebase (P1-AN-50). Optional: the stack runs without it
    build: services/tablebase
    profiles: [tablebase]
    restart: unless-stopped
    volumes:
      - ${TABLEBASE_DIR:-./data/tablebase}:/tablebase:ro
    ports:
      - 127.0.0.1:9000:9000 # for `pnpm dev`; Caddy never routes here

  caddy: # the only public service (ADR 16)
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
