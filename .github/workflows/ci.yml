name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Same images as docker-compose.yml.
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: checkmate
          POSTGRES_PASSWORD: checkmate
          POSTGRES_DB: checkmate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U checkmate -d checkmate"
          --health-interval 2s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports: ['1025:1025', '8025:8025']
    env:
      DATABASE_URL: postgres://checkmate:checkmate@localhost:5432/checkmate
      BETTER_AUTH_SECRET: ci-only-secret-used-nowhere-else-5b0e8f1d
      COMMIT_SHA: ${{ github.sha }}
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Its automatic cache needs pnpm on PATH, which corepack only adds next.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Register check (release checklist items 2, 3, 10)
        run: pnpm check:register
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @checkmate/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
